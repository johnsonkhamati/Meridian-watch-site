<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Instruments for keeping time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#1c1b1a;
    --steel:#3a3936;
    --ivory:#f0ede4;
    --paper:#e8e4d8;
    --brass:#a9843f;
    --brass-light:#c9a662;
    --green:#2f4538;
    --line:rgba(28,27,26,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--ivory);
    color:var(--graphite);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
        <circle cx="150" cy="150" r="145" fill="none" stroke="var(--graphite)" stroke-width="1.5"/>
        <circle cx="150" cy="150" r="130" fill="none" stroke="var(--line)" stroke-width="1"/>
        <g id="ticks"></g>
        <text x="150" y="95" text-anchor="middle" class="mono" font-size="11" fill="var(--steel)">12</text>
        <text x="150" y="215" text-anchor="middle" class="mono" font-size="11" fill="var(--steel)">6</text>
        <text x="210" y="155" text-anchor="middle" class="mono" font-size="11" fill="var(--steel)">3</text>
        <text x="90" y="155" text-anchor="middle" class="mono" font-size="11" fill="var(--steel)">9</text>
        <text x="150" y="185" text-anchor="middle" class="mono" font-size="9" fill="var(--brass)">MERIDIAN</text>
        <line id="hourHand" class="hand hand-hour" x1="150" y1="150" x2="150" y2="95"/>
        <line id="minHand" class="hand hand-min" x1="150" y1="150" x2="150" y2="65"/>
        <line id="secHand" class="hand hand-sec" x1="150" y1="150" x2="150" y2="55"/>
        <circle cx="150" cy="150" r="5" fill="var(--graphite)"/>
        <circle cx="150" cy="150" r="2" fill="var(--brass)"/>
      </svg>
      <div class="clock-caption" id="clockCaption">Your local time, drawn live</div>
    </div>
  </div>
  </div>
</section>

<section class="specs" id="movement">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">The movement</div>
      <h2>Every part earns its place.</h2>
      <p>No decoration for its own sake. The caliber inside every Meridian is chosen for accuracy and repairability, not for what it looks like through a display case back.</p>
    </div>
    <div class="spec-grid">
      <div class="spec-item">
        <span class="num mono">01</span>
        <h3>Automatic caliber</h3>
        <p>Self-winding movement with a 42-hour power reserve, regulated by hand over five days before it ships.</p>
      </div>
      <div class="spec-item">
        <span class="num mono">02</span>
        <h3>Sapphire crystal</h3>
        <p>Scratch-resistant to nearly anything short of another sapphire, with anti-reflective coating on both faces.</p>
      </div>
      <div class="spec-item">
        <span class="num mono">03</span>
        <h3>100m water resistance</h3>
        <p>Screw-down crown and case back tested to depth before final assembly, not just on paper.</p>
      </div>
      <div class="spec-item">
        <span class="num mono">04</span>
        <h3>316L steel case</h3>
        <p>Surgical-grade steel, brushed by hand in a single direction to catch light the same way every time.</p>
      </div>
      <div class="spec-item">
        <span class="num mono">05</span>
        <h3>±1 second accuracy</h3>
        <p>Chronometer-level regulation, verified daily, printed on a card that ships inside the case.</p>
      </div>
      <div class="spec-item">
        <span class="num mono">06</span>
        <h3>25-year service plan</h3>
        <p>One movement overhaul included, whenever it's needed, for as long as you own the watch.</p>
      </div>
    </div>
  </div>
</section>

<section id="collection">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">The collection</div>
      <h2>Three cases. One standard.</h2>
      <p>Each model shares the same movement and the same tolerances — the differences are in proportion, dial finish, and what you'll wear it for.</p>
    </div>
    <div class="collection-grid">

      <div class="watch-card">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="60" r="46" fill="#e8e4d8" stroke="#1c1b1a" stroke-width="2"/>
          <circle cx="100" cy="60" r="38" fill="none" stroke="#a9843f" stroke-width="1"/>
          <line x1="100" y1="60" x2="100" y2="34" stroke="#1c1b1a" stroke-width="3" stroke-linecap="round"/>
          <line x1="100" y1="60" x2="118" y2="60" stroke="#1c1b1a" stroke-width="2" stroke-linecap="round"/>
          <rect x="92" y="8" width="16" height="10" rx="2" fill="#1c1b1a"/>
          <rect x="70" y="106" width="60" height="70" rx="8" fill="none" stroke="#1c1b1a" stroke-width="2"/>
          <rect x="70" y="106" width="60" height="10" fill="#1c1b1a" opacity="0.08"/>
        </svg>
        <h3>The Fieldmaster</h3>
        <div class="price mono">$890</div>
        <p>40mm case, matte dial, canvas strap. Built for people who'd rather forget they're wearing it.</p>
        <a href="#contact" class="card-btn">Enquire</a>
      </div>

      <div class="watch-card">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="60" r="50" fill="#1c1b1a" stroke="#a9843f" stroke-width="2"/>
          <circle cx="100" cy="60" r="41" fill="none" stroke="#c9a662" stroke-width="1"/>
          <line x1="100" y1="60" x2="100" y2="32" stroke="#f0ede4" stroke-width="3" stroke-linecap="round"/>
          <line x1="100" y1="60" x2="120" y2="60" stroke="#f0ede4" stroke-width="2" stroke-linecap="round"/>
          <rect x="92" y="6" width="16" height="10" rx="2" fill="#1c1b1a"/>
          <rect x="65" y="110" width="70" height="70" rx="10" fill="none" stroke="#1c1b1a" stroke-width="2"/>
        </svg>
        <h3>The Meridian One</h3>
        <div class="price mono">$1,240</div>
        <p>42mm case, polished bezel, steel bracelet. The one that goes from the office to everything after.</p>
        <a href="#contact" class="card-btn">Enquire</a>
      </div>

      <div class="watch-card">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="60" r="44" fill="#2f4538" stroke="#1c1b1a" stroke-width="2"/>
          <circle cx="100" cy="60" r="36" fill="none" stroke="#a9843f" stroke-width="1"/>
          <line x1="100" y1="60" x2="100" y2="36" stroke="#f0ede4" stroke-width="3" stroke-linecap="round"/>
          <line x1="100" y1="60" x2="116" y2="60" stroke="#f0ede4" stroke-width="2" stroke-linecap="round"/>
          <rect x="93" y="10" width="14" height="9" rx="2" fill="#1c1b1a"/>
          <path d="M75 108 L125 108 L128 178 L72 178 Z" fill="none" stroke="#1c1b1a" stroke-width="2"/>
        </svg>
        <h3>The Overland</h3>
        <div class="price mono">$970</div>
        <p>39mm case, green sunburst dial, tapered leather strap. Smaller wrists, no compromise on the movement.</p>
        <a href="#contact" class="card-btn">Enquire</a>
      </div>

    </div>
  </div>
</section>

<section id="craft">
  <div class="wrap">
    <div class="craft">
      <div class="craft-visual">
        <svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
          <rect width="400" height="500" fill="#2f4538"/>
          <g opacity="0.5">
            <circle cx="200" cy="200" r="150" fill="none" stroke="#f0ede4" stroke-width="1"/>
            <circle cx="200" cy="200" r="110" fill="none" stroke="#f0ede4" stroke-width="1"/>
            <circle cx="200" cy="200" r="70" fill="none" stroke="#c9a662" stroke-width="1"/>
          </g>
          <g fill="none" stroke="#c9a662" stroke-width="1.2">
            <circle cx="150" cy="150" r="26"/>
            <circle cx="255" cy="170" r="18"/>
            <circle cx="220" cy="270" r="34"/>
            <circle cx="130" cy="300" r="14"/>
          </g>
          <g stroke="#f0ede4" stroke-width="0.6" opacity="0.6">
            <line x1="150" y1="176" x2="150" y2="300"/>
            <line x1="220" y1="236" x2="255" y2="188"/>
          </g>
        </svg>
      </div>
      <div class="craft-copy">
        <div class="eyebrow">Craft</div>
        <h2>Assembled by four people, not a hundred.</h2>
        <p>Our workshop finishes fewer than nine thousand watches a year. Every case is inspected under magnification before it's allowed to leave the bench — not sampled, every one.</p>
        <div class="craft-list">
          <div><span class="mono">I.</span> Movements regulated in six positions over five days</div>
          <div><span class="mono">II.</span> Dials printed and lacquered in-house, batch of forty</div>
          <div><span class="mono">III.</span> Hands set and lumed under a loupe, by hand</div>
          <div><span class="mono">IV.</span> Final timing check the morning it ships</div>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="contact">
  <div class="wrap">
    <div class="newsletter">
      <div>
        <h2>Get notified before the next run.</h2>
        <p>We build in small batches. Leave your email and we'll tell you when the next one opens — nothing else.</p>
      </div>
      <div>
        <form class="signup-form" id="signupForm" novalidate>
          <input type="email" id="emailInput" placeholder="you@example.com" aria-label="Email address">
          <button type="submit">Notify me</button>
        </form>
        <div class="form-msg" id="formMsg"></div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-grid">
      <div class="logo">MERIDIAN<span>.</span></div>
      <div class="footer-links">
        <a href="#collection">Collection</a>
        <a href="#movement">Movement</a>
        <a href="#craft">Craft</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
    <div class="footer-fine">© 2026 Meridian Watch Co. — Regulated to ±1 second a day, or your money back.</div>
  </div>
</footer>

<script>
  const ticks = document.getElementById('ticks');
  for(let i=0;i<60;i++){
    const angle = (i/60)*2*Math.PI;
    const isMajor = i%5===0;
    const rOuter = 145;
    const rInner = isMajor ? 128 : 137;
    const x1 = 150 + rOuter*Math.sin(angle);
    const y1 = 150 - rOuter*Math.cos(angle);
    const x2 = 150 + rInner*Math.sin(angle);
    const y2 = 150 - rInner*Math.cos(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1.toFixed(2));
    line.setAttribute('y1', y1.toFixed(2));
    line.setAttribute('x2', x2.toFixed(2));
    line.setAttribute('y2', y2.toFixed(2));
    line.setAttribute('class', 'tick' + (isMajor ? ' major' : ''));
    ticks.appendChild(line);
  }

  function updateClock(){
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    const hourAngle = (h + m/60) * 30;
    const minAngle = (m + s/60) * 6;
    const secAngle = s * 6;

    document.getElementById('hourHand').setAttribute('transform', `rotate(${hourAngle} 150 150)`);
    document.getElementById('minHand').setAttribute('transform', `rotate(${minAngle} 150 150)`);
    document.getElementById('secHand').setAttribute('transform', `rotate(${secAngle} 150 150)`);

    const caption = document.getElementById('clockCaption');
    const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    caption.textContent = 'Your local time — ' + timeStr;
  }
  updateClock();
  setInterval(updateClock, 1000);

  const menuBtn = document.getElementById('menuBtn');
  const mobilePanel = document.getElementById('mobilePanel');
  menuBtn.addEventListener('click', () => {
    mobilePanel.classList.toggle('open');
  });
  mobilePanel.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => mobilePanel.classList.remove('open'));
  });

  const signupForm = document.getElementById('signupForm');
  const formMsg = document.getElementById('formMsg');
  signupForm.addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('emailInput').value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    formMsg.classList.remove('show','error','success');
    if(!valid){
      formMsg.textContent = 'Enter a valid email address.';
      formMsg.classList.add('show','error');
      return;
    }
    formMsg.textContent = "You're on the list — we'll be in touch before the next run opens.";
    formMsg.classList.add('show','success');
    signupForm.reset();
  });
</script>

</body>
</html>
